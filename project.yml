# Optional Xcode project, generated with XcodeGen (brew install xcodegen; xcodegen).
# scripts/build-app.sh builds the same app without Xcode.
name: Stash
options:
  bundleIdPrefix: dev.grasco
  deploymentTarget:
    macOS: "26.0"
packages:
  StashCore:
    path: .
targets:
  Stash:
    type: application
    platform: macOS
    sources:
      - path: Sources/Stash
        excludes:
          - "Resources/**"
      - path: Sources/Stash/Resources
        buildPhase: resources
      - path: Extension
        type: folder
        buildPhase: resources
    dependencies:
      - package: StashCore
        product: StashCore
    settings:
      base:
        PRODUCT_NAME: Stash
        PRODUCT_BUNDLE_IDENTIFIER: dev.grasco.stash
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Stash.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

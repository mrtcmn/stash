<!-- DMG window background, 660x400. Render with scripts/dmg-background.sh. Icons sit at x=170 and x=490, y=190. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ae9"/>
      <stop offset="0.45" stop-color="#8cb8f3"/>
      <stop offset="1" stop-color="#eaf2fd"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="660" height="400" fill="url(#sky)"/>
  <g fill="#fff" filter="url(#soft)">
    <ellipse cx="60" cy="90" rx="170" ry="60" opacity="0.45"/>
    <ellipse cx="620" cy="60" rx="160" ry="55" opacity="0.35"/>
    <ellipse cx="140" cy="330" rx="260" ry="80" opacity="0.6"/>
    <ellipse cx="560" cy="320" rx="220" ry="80" opacity="0.55"/>
  </g>
  <path d="M290 190h76m-14-14 14 14-14 14" fill="none" stroke="#0a1f4a" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="78" text-anchor="middle" font-family="Helvetica Neue" font-size="15" font-weight="500" fill="#fff">Drag Stash to Applications</text>
</svg>
